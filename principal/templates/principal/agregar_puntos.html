{% extends 'principal/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto my-10 bg-white p-8 rounded-2xl shadow-sm border border-stone-100">
    <h2 class="text-2xl font-bold text-stone-800 mb-6 flex items-center gap-2">
        <span class="p-2 bg-amber-100 text-amber-600 rounded-lg">⭐</span>
        Agregar Puntos
    </h2>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        
        <div>
            <label class="block text-sm font-medium text-stone-600">Equipo</label>
            {{ form.grupo }}
        </div>

        <div>
            <label class="block text-sm font-medium text-stone-600">Cantidad de Puntos</label>
            {{ form.cantidad }}
        </div>

        <div>
            <label class="block text-sm font-medium text-stone-600">Motivo</label>
            {{ form.motivo }}
        </div>

        <div class="flex justify-end gap-3 mt-8">
            <a href="{% url 'ranking' %}" class="px-4 py-2 text-stone-500 hover:text-stone-700">Cancelar</a>
            <button type="submit" class="bg-amber-600 text-white px-6 py-2 rounded-xl font-bold hover:bg-amber-700">
                Agregar Puntos
            </button>
        </div>
    </form>
</div>
{% endblock %}
