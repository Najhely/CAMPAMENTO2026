{% extends 'principal/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto my-10 bg-white p-8 rounded-2xl shadow-sm border border-stone-100">
    <h2 class="text-2xl font-bold text-stone-800 mb-6 flex items-center gap-2">
        <span class="p-2 bg-indigo-100 text-indigo-600 rounded-lg">✏️</span>
        Editar Artículo
    </h2>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="flex justify-end gap-3 mt-8">
            <a href="{% url 'listar_inventario' %}" class="px-4 py-2 text-stone-500 hover:text-stone-700">Cancelar</a>
            <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded-xl font-bold hover:bg-indigo-700">Guardar</button>
        </div>
    </form>
</div>
{% endblock %}
