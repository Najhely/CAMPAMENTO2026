{% extends 'principal/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto my-10 bg-white p-8 rounded-2xl shadow-sm border border-stone-100">
    <h2 class="text-2xl font-bold text-stone-800 mb-6 flex items-center gap-2">
        <span class="p-2 bg-red-100 text-red-600 rounded-lg">⚠️</span>
        Eliminar Usuario
    </h2>

    <div class="bg-red-50 border border-red-200 p-4 rounded-lg mb-6">
        <p class="text-red-800">¿Estás seguro de que deseas eliminar al usuario <strong>{{ usuario.username }}</strong>?</p>
        <p class="text-red-700 text-sm mt-2">Esta acción no se puede deshacer.</p>
    </div>

    <form method="post" class="space-y-4">
        {% csrf_token %}

        <div class="flex justify-end gap-3 mt-8">
            <a href="{% url 'listar_usuarios' %}" class="px-4 py-2 text-stone-500 hover:text-stone-700">Cancelar</a>
            <button type="submit" class="bg-red-600 text-white px-6 py-2 rounded-xl font-bold hover:bg-red-700">
                Confirmar Eliminación
            </button>
        </div>
    </form>
</div>
{% endblock %}
